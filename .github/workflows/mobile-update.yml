name: Deploy Mobile OTA Update

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-update.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  update-preview:
    name: Publish OTA Update (Preview Channel)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Preview Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel preview --message "CI/CD automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # DEV_* — NOT the unprefixed NEXT_PUBLIC_SUPABASE_* secrets, which hold
          # STAGING values (ci.yml says so in its header: "Do not use them here").
          #
          # This job used the unprefixed ones, so every dev OTA shipped a bundle
          # whose API was dev.influnet.io but whose DATABASE was the staging
          # project. Sign-in then succeeded against staging and issued a
          # staging-signed JWT, which dev's API rejected as 401 — and the app's
          # global 401 handler signs you out and returns you to the welcome
          # screen. The symptom was a correct password producing NO error at
          # all and a bounce back to the Creator/Business chooser, because
          # nothing failed: two halves of the app were simply talking to two
          # different databases.
          #
          # The two must always be chosen together. If you change one, change
          # the other in the same edit.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          # Must match the branch being published, or the app talks to a backend
          # that does not have the code you just pushed. A dev-branch update was
          # pointing testers at the Azure staging container — which also has no
          # STREAM_API_SECRET configured, so chat tokens fail there outright.
          EXPO_PUBLIC_API_BASE_URL: https://dev.influnet.io
          EXPO_PUBLIC_STREAM_API_KEY: ${{ secrets.DEV_STREAM_API_KEY || 'kw5uagr7nxs7' }}

  update-production:
    name: Publish OTA Update (Production Channel)
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Production Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel production --message "Production automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The unprefixed secrets hold STAGING values, which is correct for the
          # `staging` branch and the only branch that reaches this job today
          # (`main` is not on origin — see docs/operations/CICD_INSTRUCTIONS).
          #
          # WHEN A REAL PROD TIER EXISTS, this becomes wrong in the same way the
          # preview job was: pushing `main` would ship a production app pointed
          # at the staging database. Make these branch-aware at the same time
          # you add PRODUCTION_APP_URL's database counterpart, and keep the URL
          # and the anon key on the same branch condition — a mismatched pair is
          # what caused the silent sign-out loop on preview.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_APP_URL || 'https://staging.influnet.io' }}
          EXPO_PUBLIC_STREAM_API_KEY: ${{ secrets.STREAM_API_KEY || '5z6hhrgmrdj9' }}
