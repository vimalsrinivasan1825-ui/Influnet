name: Deploy Mobile OTA Update

# OTA publishes:
#   - preview channel ← pushes to dev (dev is the test environment)
#   - production channel ← pushes to staging (staging is production), full
#     rollout, AND workflow_dispatch for a manual/partial-rollout push.
#
# F3 (launch audit 2026-09-18) removed auto-fire-on-push-to-staging after it
# shipped untested JS to every installed app with no approval and no rollout
# control. Reinstated 2026-10-01 at the owner's explicit request — staging's
# own CI (ci.yml / Deploy Staging to Azure Container Apps) is the review gate
# now, so a push to staging is treated as already vetted. If that stops being
# true, revert to manual-only. Partial rollouts from workflow_dispatch are
# reverted with `eas update:revert-update-rollout` if something goes wrong;
# a bad auto-fired 100% rollout needs a follow-up `eas update:rollback`.

on:
  push:
    branches:
      - dev
      - staging
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-update.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      rollout_percentage:
        description: 'Percentage of production users to roll the update out to (1-100). Start low; revert with `eas update:revert-update-rollout` if anything breaks.'
        required: true
        default: '10'
        type: string
      message:
        description: 'Update message shown in the EAS dashboard.'
        required: false
        default: 'Manual production OTA update'

jobs:
  update-preview:
    name: Publish OTA Update (Preview Channel)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Preview Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel preview --message "CI/CD automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jaajosocopoicmqcffuu.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_zbfMv-IHhMwsLBj_wAXbng_b6byZL5x' }}
          EXPO_PUBLIC_API_BASE_URL: https://dev.influnet.io
          EXPO_PUBLIC_STREAM_API_KEY: ${{ vars.STREAM_API_KEY || '2rpeptjh9ug8' }}

  update-production:
    name: Publish OTA Update (Production Channel)
    # Fires on push to staging (full rollout) or on manual workflow_dispatch
    # (rollout_percentage input, for a partial/manual push).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    # The owner adds required reviewers to the `production` GitHub Environment
    # (Settings → Environments → production) if a manual gate is still wanted.
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate rollout percentage
        env:
          # Passed through the environment, never interpolated into the script: a
          # dispatch input is attacker-controlled text as far as the shell goes.
          ROLLOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_percentage || '100' }}
        run: |
          p="$ROLLOUT"
          case "$p" in
            ''|*[!0-9]*) echo "::error::rollout_percentage must be a whole number, got '$p'"; exit 1 ;;
          esac
          if [ "$p" -lt 1 ] || [ "$p" -gt 100 ]; then
            echo "::error::rollout_percentage must be between 1 and 100, got '$p'"
            exit 1
          fi
          echo "Rolling out to $p% of production users."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Production Channel
        working-directory: ./apps/mobile
        # eas update --rollout-percentage only accepts 0-99; 100 means "full
        # rollout", which is the default when the flag is omitted entirely.
        run: |
          if [ "$ROLLOUT" = "100" ]; then
            npx eas-cli update --channel production --message "$MESSAGE ($GITHUB_SHA)" --non-interactive
          else
            npx eas-cli update --channel production --rollout-percentage "$ROLLOUT" --message "$MESSAGE ($GITHUB_SHA)" --non-interactive
          fi
        env:
          ROLLOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_percentage || '100' }}
          MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || 'Production automated update' }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # An OTA bundles JS with THIS environment, not eas.json's `production`
          # profile. Without this an update would switch the Pro purchase UI back on
          # inside the store apps (Apple 3.1.1 / Google Payments; see
          # apps/mobile/lib/use-upgrade.ts). Keep it in step with eas.json.
          EXPO_PUBLIC_HIDE_PRO_PURCHASE: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://aokdansyqxracuwsosji.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_ihsN1x749RpcTUckCMEV0Q_wZNrjiBZ' }}
          EXPO_PUBLIC_API_BASE_URL: https://staging.influnet.io
          EXPO_PUBLIC_STREAM_API_KEY: ${{ vars.STREAM_API_KEY || '5z6hhrgmrdj9' }}
