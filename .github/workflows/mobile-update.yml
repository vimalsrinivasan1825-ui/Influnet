name: Deploy Mobile OTA Update

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-update.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  update-preview:
    name: Publish OTA Update (Preview Channel)
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Preview Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel preview --message "CI/CD automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: "https://influnet-staging.icysky-7414f4c6.southindia.azurecontainerapps.io"

  update-production:
    name: Publish OTA Update (Production Channel)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Production Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel production --message "Production automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_APP_URL }}
