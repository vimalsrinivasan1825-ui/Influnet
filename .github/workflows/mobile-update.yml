name: Deploy Mobile OTA Update

# OTA publishes go only where they are safe to be automatic:
#   - preview channel ← pushes to dev (dev is the test environment)
#   - production channel ← MANUAL ONLY (workflow_dispatch), behind the
#     `production` GitHub Environment so the owner can require reviewers on it.
#
# F3 (launch audit 2026-09-18): this job used to fire on every push to
# `staging` — staging is production since 2026-09-16 — so merging to staging
# pushed new JS straight to every installed app with no approval and no
# rollout. It now runs only when a human starts it, and can roll out to a
# percentage of users first (--rollout-percentage, verified against
# eas-cli 21+; see `eas update --help`). Partial rollouts are reverted with
# `eas update:revert-update-rollout` if something goes wrong.

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-update.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      rollout_percentage:
        description: 'Percentage of production users to roll the update out to (1-100). Start low; revert with `eas update:revert-update-rollout` if anything breaks.'
        required: true
        default: '10'
        type: string
      message:
        description: 'Update message shown in the EAS dashboard.'
        required: false
        default: 'Manual production OTA update'

jobs:
  update-preview:
    name: Publish OTA Update (Preview Channel)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Preview Channel
        working-directory: ./apps/mobile
        run: npx eas-cli update --channel preview --message "CI/CD automated update (${{ github.sha }})" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jaajosocopoicmqcffuu.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_zbfMv-IHhMwsLBj_wAXbng_b6byZL5x' }}
          EXPO_PUBLIC_API_BASE_URL: https://dev.influnet.io
          EXPO_PUBLIC_STREAM_API_KEY: ${{ vars.STREAM_API_KEY || '2rpeptjh9ug8' }}

  update-production:
    name: Publish OTA Update (Production Channel — manual)
    # Manual only. A push to staging must never reach installed apps by itself.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The owner adds required reviewers to the `production` GitHub Environment
    # (Settings → Environments → production). The job waits for approval there.
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate rollout percentage
        run: |
          p="${{ inputs.rollout_percentage }}"
          case "$p" in
            ''|*[!0-9]*) echo "::error::rollout_percentage must be a whole number, got '$p'"; exit 1 ;;
          esac
          if [ "$p" -lt 1 ] || [ "$p" -gt 100 ]; then
            echo "::error::rollout_percentage must be between 1 and 100, got '$p'"
            exit 1
          fi
          echo "Rolling out to $p% of production users."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Production Channel
        working-directory: ./apps/mobile
        run: >-
          npx eas-cli update --channel production
          --rollout-percentage ${{ inputs.rollout_percentage }}
          --message "${{ inputs.message }} (${{ github.sha }})"
          --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://aokdansyqxracuwsosji.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_ihsN1x749RpcTUckCMEV0Q_wZNrjiBZ' }}
          EXPO_PUBLIC_API_BASE_URL: https://staging.influnet.io
          EXPO_PUBLIC_STREAM_API_KEY: ${{ vars.STREAM_API_KEY || '5z6hhrgmrdj9' }}
