name: Deploy to Staging (Azure)

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Azure Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for smoke tests)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (needed for smoke test execution)
        run: npm ci

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:staging-latest \
            -f apps/web/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:staging-latest

      - name: Deploy to Azure App Service (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_STAGING_NAME }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:${{ github.sha }}'

      - name: Run Smoke Tests
        run: node scripts/smoke.mjs ${{ secrets.STAGING_APP_URL }}
