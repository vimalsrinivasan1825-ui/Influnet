name: Deploy Staging to Azure Container Apps

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/web/**'
      - 'packages/**'
      # A migration-only change is still a deploy: without this the schema
      # job below would never fire for a PR that only adds SQL.
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-staging.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'

env:
  ACR_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  ACR_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  CONTAINER_APP_NAME: "influnet-staging"
  RESOURCE_GROUP: "influnet-rg"
  IMAGE_NAME: "influnet-web"
  # Two URLs on purpose. STAGING_URL is the origin CI probes — it resolves even
  # if DNS or the custom-domain certificate is broken, so a health check failure
  # means the app is down rather than the domain being misconfigured.
  # STAGING_PUBLIC_URL is what users (and email links) see.
  STAGING_URL: "https://influnet-staging.icysky-7414f4c6.southindia.azurecontainerapps.io"
  STAGING_PUBLIC_URL: "https://staging.influnet.io"

concurrency:
  # Never let two staging deploys migrate the same database at once, and
  # never cancel a run part-way through applying schema changes.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Schema first, app second. Migrations here are additive (new tables,
  # columns and functions), so the OLD app version keeps working against the
  # NEW schema for the minute between this job and the deploy below — whereas
  # the reverse order would briefly run new code against a schema that has
  # not caught up yet. If a migration ever fails, `needs:` stops the deploy
  # entirely rather than shipping code its schema cannot support.
  migrate:
    name: Apply pending migrations to the staging database
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      # Not a secret — shipped to the browser as NEXT_PUBLIC_SUPABASE_URL.
      # NOTE: this is a DIFFERENT Supabase project from dev.
      PROJECT_REF: aokdansyqxracuwsosji
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PINNED, deliberately. `version: latest` made every deploy depend on
      # whatever supabase/cli shipped that morning, and on 2026-08-07 v2.112.0
      # broke `supabase link` with
      #   failed to get api keys: SchemaError(... at [2]["inserted_at"])
      # — its Management API client rejects the timestamp format the API
      # returns. Nothing in this repo changed; the deploy just stopped working.
      # Bump this on purpose, after checking a run passes.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link to the staging project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show migration state before applying
        run: supabase migration list

      - name: Apply pending migrations
        # See migrate-dev.yml for why --include-all matters here.
        run: supabase db push --include-all

      - name: Confirm migration state after applying
        run: supabase migration list

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      # Fail fast, and say why. See deploy-dev.yml — same pattern, same
      # failure mode (a container that never boots reads like a bad port).
      # These come from the `staging` GitHub Environment, populated by
      # scripts/setup-environment-secrets.sh. DO NOT MERGE this workflow
      # change into `staging` until that script's staging section has been
      # run — this guard will fail loudly if it hasn't, rather than silently
      # deploying a container that can't start.
      - name: Check the staging Supabase credentials are present
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          fail=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::vars.SUPABASE_URL is empty in the 'staging' environment. Run scripts/setup-environment-secrets.sh."
            fail=1
          fi
          if [ -z "$ANON_KEY" ]; then
            echo "::error::vars.SUPABASE_ANON_KEY is empty in the 'staging' environment. Run scripts/setup-environment-secrets.sh."
            fail=1
          fi
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::secrets.SUPABASE_SERVICE_ROLE_KEY is empty in the 'staging' environment. Run scripts/setup-environment-secrets.sh."
            fail=1
          fi
          case "$SERVICE_KEY" in
            sbp_*) echo "::error::SUPABASE_SERVICE_ROLE_KEY (staging environment) is a management token (sbp_...), not a service-role JWT (eyJ...)."; fail=1 ;;
          esac
          [ "$fail" = "0" ] && echo "Staging Supabase credentials present."
          exit $fail

      # Build-time: NEXT_PUBLIC_* vars are baked into the frontend JS
      - name: Build and Push Docker Image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_STREAM_API_KEY="${{ vars.STREAM_API_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.STAGING_PUBLIC_URL }}" \
            --build-arg NEXT_PUBLIC_PHONE_OTP_ENABLED="${{ secrets.NEXT_PUBLIC_PHONE_OTP_ENABLED }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ env.ACR_USERNAME }}
          registryPassword: ${{ env.ACR_PASSWORD }}

      # Run-time: Backend secrets injected via az CLI (no Azure Portal access needed)
      #
      # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY were NOT set
      # here before 2026-08-12 — this workflow only ever passed them as build
      # args. Staging's container has been booting only because someone set
      # them by hand in the Azure portal at some point, which is exactly the
      # trap that broke dev's first cutover deploy: `describeEnv()` checks
      # them with a dynamic `process.env[k]` lookup that build-time inlining
      # cannot satisfy, so a container missing them throws at boot and Azure's
      # ingress answers every path with a bare 500. See AGENTS.md and
      # docs/operations/HANDOVER.md. Setting them here, authoritatively,
      # closes that latent gap rather than continuing to rely on a manual
      # portal edit surviving every future deploy.
      #
      # These values are authoritative: every deploy overwrites whatever is
      # currently set on the container app, so a fix applied by hand in the
      # Azure portal survives only until the next push. Change it here.
      #
      # The email settings read from repository secrets rather than literals so
      # they can be flipped without a deploy.
      #
      # EMAIL_ALLOWLIST is deliberately set EMPTY, which means "deliver to any
      # address" — staging must be able to mail arbitrary testers, not only
      # @influnet.io mailboxes. Set explicitly rather than omitted so the deploy
      # also CLEARS a value left behind on the container app by an earlier run or
      # a manual portal edit; omitting the name would leave the old one in place.
      #
      # This is safe here because staging has its own database, so there is no
      # pool of real users' addresses to mail by accident. Do NOT copy this line
      # into a workflow whose environment points at the production database — to
      # re-tighten, put a comma-separated list here (`@influnet.io,someone@x.com`)
      # or wire it back to secrets.EMAIL_ALLOWLIST.
      #
      # SUBSCRIPTIONS_ENABLED is set to a literal `false` rather than left out.
      # Absent and false behave identically in code, but "absent" is a guess
      # about a default and "false" is a decision — and per the note above, a
      # value omitted here is also a value this deploy cannot CLEAR if somebody
      # sets it by hand in the portal. Flip it to `true` when staging is meant
      # to exercise the paid tiers; migration 115 ships the schema either way,
      # and with the flag off every gate is open exactly as it is today.
      - name: Set Backend Environment Variables on Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --set-env-vars \
                "NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}" \
                "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" \
                "SUPABASE_URL=${{ vars.SUPABASE_URL }}" \
                "NEXT_PUBLIC_APP_URL=${{ env.STAGING_PUBLIC_URL }}" \
                "NEXT_PUBLIC_APP_ENV=staging" \
                "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                "STREAM_API_KEY=${{ vars.STREAM_API_KEY }}" \
                "STREAM_API_SECRET=${{ secrets.STREAM_API_SECRET }}" \
                "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
                "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" \
                "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" \
                "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
                "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" \
                "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
                "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
                "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" \
                "NOTIFY_EMAILS_ENABLED=${{ secrets.NOTIFY_EMAILS_ENABLED }}" \
                "EMAIL_ALLOWLIST=" \
                "EMAIL_TEST_SECRET=${{ secrets.EMAIL_TEST_SECRET }}" \
                "APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}" \
                "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
                "SUBSCRIPTIONS_ENABLED=false" \
                "APP_ENV=staging"

      - name: Wait for the new revision to serve traffic
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ env.STAGING_URL }}/api/health" > /dev/null; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Not ready yet (attempt ${i}/30); retrying in 10s..."
            sleep 10
          done
          echo "Revision did not become healthy within 5 minutes."
          exit 1

      # The profile args are built conditionally on purpose. smoke.mjs treats an
      # empty positional argument as the target URL, so passing `--creator ""`
      # (what an unset repository variable expands to) silently blanks the URL
      # and every check then fails against "". Omitting the flag entirely makes
      # the script skip that check instead, which is the intended degradation.
      #
      # SMOKE_BUSINESS_USERNAME is expected to be UNSET: business profiles are
      # private, and /b/<user> permanent-redirects to /<user>, which bounces an
      # anonymous visitor to /login. fetch() follows that redirect and gets a
      # 200 from the login page — so the check would pass without ever loading a
      # business profile. A false green is worse than no check. The variable is
      # still read here so the step needs no edit if that access model changes.
      - name: Run Smoke Tests
        env:
          SMOKE_CREATOR: ${{ vars.SMOKE_CREATOR_USERNAME }}
          SMOKE_BUSINESS: ${{ vars.SMOKE_BUSINESS_USERNAME }}
        run: |
          ARGS=""
          [ -n "$SMOKE_CREATOR" ] && ARGS="$ARGS --creator $SMOKE_CREATOR"
          [ -n "$SMOKE_BUSINESS" ] && ARGS="$ARGS --business $SMOKE_BUSINESS"
          node scripts/smoke.mjs "${{ env.STAGING_URL }}" $ARGS
