name: Deploy to Production (Azure)

# NOTE ON MIGRATIONS — there is deliberately no `supabase db push` here.
#
# As of 2026-08-04 this workflow's app tier and the staging tier point at the
# SAME Supabase project (aokdansyqxracuwsosji), so deploy-staging.yml has
# already applied every pending migration by the time anything reaches `main`.
# Adding a second push here would be a no-op at best.
#
# When production is split onto its own database, this workflow needs its own
# migrate job — and unlike dev/staging it should stay gated behind the
# `environment: production` approval below, because at that point the target
# really is customer data.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'

jobs:
  promote-and-deploy:
    name: Promote Staging Image & Deploy to Production
    runs-on: ubuntu-latest
    environment: production # Triggers manual approval gating in GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Promote Staging Image to Production
        run: |
          docker pull ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:staging-latest
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:staging-latest ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:prod-${{ github.sha }}
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:staging-latest ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:prod-latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:prod-${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:prod-latest

      - name: Deploy to Azure App Service (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_PROD_NAME }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/influnet-web:prod-${{ github.sha }}'

      - name: Run Smoke Tests
        run: node scripts/smoke.mjs ${{ secrets.PRODUCTION_APP_URL }}
