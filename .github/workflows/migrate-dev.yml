name: Apply Migrations (Dev)

# Dev's app code is deployed by Railway, not by a
# workflow in this repo — so database migrations need their own job here.
#
# Historically the failure mode was always the same: a migration was written
# locally, verified against a local/dev DB by hand, and then never applied to
# the hosted one, so the deployed app ran against a schema that was missing
# the table or column it had just started depending on. This closes that gap —
# the moment a migration file lands on `dev`, it is applied to the dev
# database automatically.
#
# Dev is not customer-facing, so this applies with no manual gate. Staging
# does the same thing inside deploy-staging.yml, but ordered ahead of the app
# deploy. When a real production tier exists, its workflow should gate this
# step behind `environment:` approval rather than copying this file as-is.

on:
  push:
    branches:
      - dev
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate-dev.yml'
  # Lets you force a re-sync from the Actions tab if the dev DB ever drifts
  # (e.g. a migration applied by hand, or a run that failed part-way).
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession must not race each other into the same
  # database. Queue them instead — and never cancel a run mid-migration.
  group: migrate-dev
  cancel-in-progress: false

jobs:
  migrate:
    name: Push pending migrations to the dev database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      # Not a secret — this ref is already committed in supabase/config.toml
      # and shipped to the browser in NEXT_PUBLIC_SUPABASE_URL.
      PROJECT_REF: jaajosocopoicmqcffuu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pinned for the same reason as deploy-staging.yml: CLI v2.112.0 broke
      # `supabase link` on 2026-08-07. Keep the two workflows on the same
      # version so dev and staging never migrate with different tooling.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link to the dev project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show migration state before applying
        # Purely informational, but it is what makes a failed run diagnosable:
        # the log shows exactly which migrations were pending beforehand.
        run: supabase migration list

      - name: Apply pending migrations
        # --include-all also picks up any migration numbered BELOW the latest
        # one already applied. Without it, a migration added out of order is
        # silently skipped forever, which is the exact drift this job exists
        # to prevent. Already-applied migrations are never re-run.
        run: supabase db push --include-all

      - name: Confirm migration state after applying
        run: supabase migration list
